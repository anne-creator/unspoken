[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unspoken-home-demo"
version = "0.1.0"
description = "A simulated smart home with a real Strands Decider 2B and Claude Haiku escalation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Anne"}]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2", "strands-agents>=1.61", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/anne-creator/unspoken"
Issues = "https://github.com/anne-creator/unspoken/issues"

[tool.setuptools.packages.find]
include = ["homedemo*"]

[tool.setuptools.package-data]
homedemo = ["home.json", "scenarios/library/*.json", "web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
